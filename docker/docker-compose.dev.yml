name: udesa-x-backoffice

services:
  backoffice:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    container_name: udesa-x-backoffice-dev
    ports:
      - '${PORT:-5173}:5173'
    environment:
      # Empty keeps the client on /api of its own origin, which Vite hands to the gateway.
      VITE_API_URL: ${VITE_API_URL:-}
      # The gateway run by its own docker-compose.dev.yml on the host.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8002}
    extra_hosts:
      # Docker Desktop resolves it on its own; Linux needs the mapping.
      - 'host.docker.internal:host-gateway'
    volumes:
      - ../src:/app/src
      - ../public:/app/public
      - ../index.html:/app/index.html
      - ../vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    restart: unless-stopped

  # No source volume on purpose: mounting it would replace what the image
  # carries and stop testing the real artifact.
  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
    # Without this it would start on every `docker compose up`.
    profiles: ['test']
