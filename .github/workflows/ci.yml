name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: tds-g3-2s2026/udesa-x-platform/.github/workflows/ci-node.yml@main
    secrets: inherit
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_API_URL: https://api.example.invalid/api

  # Only a commit on main that passed CI gets published. The backoffice is
  # static: it goes to S3 behind CloudFront, not to the cluster.
  deploy:
    needs: [ci, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Verificar el entorno
        run: |
          faltan=()
          for nombre in AWS_ROLE_ARN AWS_REGION S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            [ -n "${!nombre}" ] || faltan+=("$nombre")
          done
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Faltan los secrets de organización: ${faltan[*]}."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Compilar
        run: bun run build
        env:
          # Same domain as the backoffice: CloudFront sends /api/* to the ALB.
          VITE_API_URL: https://tds-group-3.tds-linar.udesa.edu.ar/api

      - name: Asumir el rol de AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: deploy-backoffice-${{ github.run_id }}

      # --delete removes from the bucket what the new build no longer has.
      - name: Publicar en S3
        run: aws s3 sync dist/ "s3://$S3_BUCKET/" --delete

      # Without it, CloudFront keeps serving the previous version from its cache.
      - name: Invalidar la caché de CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
